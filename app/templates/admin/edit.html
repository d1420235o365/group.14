{% extends "base.html" %}
{% block title %}編輯書籍 — 管理後台{% endblock %}

{% block content %}
<div class="container page-container">
  <nav class="breadcrumb">
    <a href="{{ url_for('admin.dashboard') }}">管理後台</a>
    <span class="breadcrumb-sep">›</span>
    <span class="breadcrumb-current">編輯：{{ book.title }}</span>
  </nav>

  <div class="form-card">
    <div class="form-card-header">
      <h1 class="page-title">✏️ 編輯書籍</h1>
    </div>

    <form id="edit-form" method="POST"
          action="{{ url_for('admin.edit_book', book_id=book.id) }}"
          class="book-form">
      <div class="form-grid">
        <div class="form-group form-group--full">
          <label for="title" class="form-label">書名 <span class="required">*</span></label>
          <input id="title" type="text" name="title" class="form-input"
                 value="{{ book.title }}" required />
        </div>
        <div class="form-group">
          <label for="author" class="form-label">作者 <span class="required">*</span></label>
          <input id="author" type="text" name="author" class="form-input"
                 value="{{ book.author }}" required />
        </div>
        <div class="form-group">
          <label for="isbn" class="form-label">ISBN</label>
          <input id="isbn" type="text" name="isbn" class="form-input"
                 value="{{ book.isbn or '' }}" />
        </div>
        <div class="form-group">
          <label for="category" class="form-label">分類</label>
          <select id="category" name="category" class="form-input">
            <option value="">請選擇分類</option>
            {% for cat in ['文學','科技','商業','歷史','藝術','自然科學','社會科學','其他'] %}
              <option value="{{ cat }}" {% if book.category == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="status" class="form-label">庫存狀態 <span class="required">*</span></label>
          <select id="status" name="status" class="form-input" required>
            <option value="在庫"   {% if book.status == '在庫' %}selected{% endif %}>在庫</option>
            <option value="已借出" {% if book.status == '已借出' %}selected{% endif %}>已借出</option>
            <option value="補貨中" {% if book.status == '補貨中' %}selected{% endif %}>補貨中</option>
          </select>
        </div>
        <div class="form-group">
          <label for="quantity" class="form-label">庫存數量 <span class="required">*</span></label>
          <input id="quantity" type="number" name="quantity" class="form-input"
                 value="{{ book.quantity }}" min="0" required />
        </div>
        <div class="form-group form-group--full">
          <label for="description" class="form-label">書籍簡介</label>
          <textarea id="description" name="description" class="form-textarea"
                    rows="4">{{ book.description or '' }}</textarea>
        </div>
      </div>

      <div class="form-actions">
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn--secondary">取消</a>
        <button id="submit-edit" type="submit" class="btn btn--primary">儲存變更</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
