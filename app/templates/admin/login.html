{% extends "base.html" %}
{% block title %}管理者登入 — 書籍查詢系統{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🔐</div>
      <h1 class="auth-title">管理後台登入</h1>
      <p class="auth-subtitle">請輸入管理者密碼以繼續</p>
    </div>
    <form id="login-form" method="POST" action="{{ url_for('admin.login') }}" class="auth-form">
      <div class="form-group">
        <label for="password" class="form-label">管理者密碼</label>
        <input id="password" type="password" name="password" class="form-input"
               placeholder="請輸入密碼" required autocomplete="current-password" />
      </div>
      <button id="login-btn" type="submit" class="btn btn--primary btn--full">登入</button>
    </form>
    <div class="auth-footer">
      <a href="{{ url_for('main.index') }}">← 返回首頁</a>
    </div>
  </div>
</div>
{% endblock %}
